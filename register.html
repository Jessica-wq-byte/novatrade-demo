<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — NovaTrade</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

<div class="demo-banner">
  TEST PLATFORM — NO REAL MONEY
</div>

<header class="nav">
  <div class="brand">Nova<span>Trade</span></div>
  <a href="login.html" class="nav-link">Login</a>
</header>

<main>
  <section class="dashboard">

    <div class="panel" style="max-width:520px;margin:auto;">

      <p class="eyebrow">CREATE ACCOUNT</p>

      <h2>Create your NovaTrade account</h2>

      <p style="color:#8ea2b9;margin:10px 0 25px;">
        Create a test account to access your dashboard.
      </p>

      <form id="registerForm">

        <label>Full name</label>
        <input
          id="fullName"
          type="text"
          placeholder="Your full name"
          required
        >

        <label>Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >

        <label>Phone number</label>
        <input
          id="phone"
          type="tel"
          placeholder="+234 801 234 5678"
          required
        >

        <label>Country</label>
        <select id="country" required>
          <option value="">Select your country</option>
        </select>

        <label>Currency</label>
        <select id="currency" required>
          <option value="">Select your currency</option>
        </select>

        <label>Password</label>
        <input
          id="password"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          required
        >

        <label>Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm your password"
          minlength="6"
          required
        >

        <label>Referral code (optional)</label>
        <input
          id="referralCode"
          type="text"
          placeholder="Enter referral code"
        >

        <button class="launch-btn" type="submit" style="width:100%;margin-top:20px;">
          Create Account
        </button>

      </form>

      <p id="message" style="margin-top:18px;"></p>

      <p style="margin-top:20px;color:#8ea2b9;">
        Already have an account?
        <a href="login.html" style="color:#5da9ff;">Login</a>
      </p>

    </div>

  </section>
</main>

<script>

// Countries
const countries = [
  "Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda",
  "Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain",
  "Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan",
  "Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria",
  "Burkina Faso","Burundi","Cambodia","Cameroon","Canada","Cape Verde",
  "Central African Republic","Chad","Chile","China","Colombia","Comoros",
  "Congo","Costa Rica","Croatia","Cuba","Cyprus","Czech Republic",
  "Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt",
  "El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia",
  "Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana",
  "Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti",
  "Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland",
  "Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati",
  "Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya",
  "Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia",
  "Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius",
  "Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco",
  "Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand",
  "Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway",
  "Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay",
  "Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda",
  "Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines",
  "Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal",
  "Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia",
  "Solomon Islands","Somalia","South Africa","South Korea","South Sudan",
  "Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria",
  "Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga",
  "Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda",
  "Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay",
  "Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia",
  "Zimbabwe"
];

const countrySelect = document.getElementById("country");

countries.forEach(function(country) {
  const option = document.createElement("option");
  option.value = country;
  option.textContent = country;
  countrySelect.appendChild(option);
});

// Currencies
const currencies = [
  ["USD","US Dollar ($)"],
  ["EUR","Euro (€)"],
  ["GBP","British Pound (£)"],
  ["NGN","Nigerian Naira (₦)"],
  ["CAD","Canadian Dollar (C$)"],
  ["AUD","Australian Dollar (A$)"],
  ["NZD","New Zealand Dollar (NZ$)"],
  ["ZAR","South African Rand (R)"],
  ["GHS","Ghanaian Cedi (GH₵)"],
  ["KES","Kenyan Shilling (KSh)"],
  ["UGX","Ugandan Shilling (USh)"],
  ["TZS","Tanzanian Shilling (TSh)"],
  ["INR","Indian Rupee (₹)"],
  ["JPY","Japanese Yen (¥)"],
  ["CNY","Chinese Yuan (¥)"],
  ["KRW","South Korean Won (₩)"],
  ["SGD","Singapore Dollar (S$)"],
  ["HKD","Hong Kong Dollar (HK$)"],
  ["AED","UAE Dirham (د.إ)"],
  ["SAR","Saudi Riyal (﷼)"],
  ["QAR","Qatari Riyal (﷼)"],
  ["KWD","Kuwaiti Dinar (د.ك)"],
  ["BHD","Bahraini Dinar (BD)"],
  ["OMR","Omani Rial (﷼)"],
  ["TRY","Turkish Lira (₺)"],
  ["BRL","Brazilian Real (R$)"],
  ["MXN","Mexican Peso ($)"],
  ["ARS","Argentine Peso ($)"],
  ["CLP","Chilean Peso ($)"],
  ["COP","Colombian Peso ($)"],
  ["PEN","Peruvian Sol (S/)"],
  ["PHP","Philippine Peso (₱)"],
  ["IDR","Indonesian Rupiah (Rp)"],
  ["MYR","Malaysian Ringgit (RM)"],
  ["THB","Thai Baht (฿)"],
  ["VND","Vietnamese Dong (₫)"],
  ["PKR","Pakistani Rupee (₨)"],
  ["BDT","Bangladeshi Taka (৳)"],
  ["LKR","Sri Lankan Rupee (Rs)"],
  ["NPR","Nepalese Rupee (₨)"],
  ["EGP","Egyptian Pound (E£)"],
  ["MAD","Moroccan Dirham (د.م.)"],
  ["DZD","Algerian Dinar (دج)"],
  ["TND","Tunisian Dinar (د.ت)"],
  ["ETB","Ethiopian Birr"],
  ["RUB","Russian Ruble (₽)"],
  ["UAH","Ukrainian Hryvnia (₴)"],
  ["PLN","Polish Zloty (zł)"],
  ["CZK","Czech Koruna (Kč)"],
  ["SEK","Swedish Krona (kr)"],
  ["NOK","Norwegian Krone (kr)"],
  ["DKK","Danish Krone (kr)"],
  ["CHF","Swiss Franc (CHF)"]
];

const currencySelect = document.getElementById("currency");

currencies.forEach(function(currency) {
  const option = document.createElement("option");
  option.value = currency[0];
  option.textContent = currency[1];
  currencySelect.appendChild(option);
});

// Registration
const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const fullName = document.getElementById("fullName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const country = document.getElementById("country").value;
  const currency = document.getElementById("currency").value;
  const referralCode = document.getElementById("referralCode").value.trim();

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    return;
  }

  message.textContent = "Creating your account...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: fullName,
        phone: phone,
        country: country,
        currency: currency,
        referral_code: referralCode
      }
    }
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  if (!data.user) {
    message.textContent =
      "Account created. Please check your email to confirm your account.";
    return;
  }

  message.textContent =
    "Account created successfully! Redirecting...";

  setTimeout(function() {
    window.location.href = "dashboard.html";
  }, 1000);

});

</script>

</body>
</html>
