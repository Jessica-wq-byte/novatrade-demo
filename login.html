<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — NovaTrade</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

<div class="demo-banner">
  TEST PLATFORM — NO REAL MONEY
</div>

<header class="nav">
  <div class="brand">Nova<span>Trade</span></div>
  <a href="register.html">Register</a>
</header>

<main>
<section class="dashboard">

<div class="panel" style="max-width:500px;margin:auto;">

<p class="eyebrow">LOGIN</p>
<h2>Welcome back</h2>

<form id="loginForm">

<label>Email</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required>

<button type="submit" class="launch-btn" style="width:100%;margin-top:20px;">
Login
</button>

</form>

<p id="message"></p>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>
</section>
</main>

<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  message.textContent = "Signing in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    message.textContent = error.message;
    return;
  }

  window.location.href = "dashboard.html";

});

</script>

</body>
</html>
